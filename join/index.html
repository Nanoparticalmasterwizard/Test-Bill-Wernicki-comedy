<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Join the list | Bill Wernicki Comedy</title>
  <meta name="description" content="Get an email when Bill Wernicki books a new show.">
  <meta property="og:title" content="Join the list | Bill Wernicki Comedy">
  <meta property="og:description" content="Get an email when Bill Wernicki books a new show.">
  <meta property="og:image" content="https://billwernickicomedy.com/img/bill-comix.jpg">
  <meta name="theme-color" content="#0b0b0c">
  <link rel="icon" type="image/png" href="../img/bill-wernicki-logo.png">
  <link rel="apple-touch-icon" href="../img/bill-wernicki-logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../styles.css?v=30">
</head>
<body>
  <main class="join-page">
    <div class="join-page__card" data-confirm>
      <img class="join-page__logo" src="../img/bill-wernicki-logo.png" alt="Bill Wernicki Comedy logo" width="120" height="120">
      <h1>Never miss<br><span>a show</span></h1>
      <p>Get an email when Bill Wernicki books a new date. That's it.</p>
      <form class="signup" data-signup novalidate>
        <label class="signup__label" for="signup-city">City <span class="signup__opt">(optional)</span></label>
        <input class="signup__city" id="signup-city" name="city" type="text" autocomplete="address-level2" placeholder="Hartford, New Haven, wherever">
        <label class="signup__label" for="signup-email">Email address</label>
        <div class="signup__row">
          <input id="signup-email" type="email" required autocomplete="email" placeholder="you@email.com" autofocus>
          <button class="btn btn--primary" type="submit">Get show alerts</button>
        </div>
        <p class="signup__msg" role="status"></p>
      </form>
      <a class="join-page__back" href="../">See the full site →</a>
    </div>
  </main>
  <script src="../content.js?v=15"></script>
  <script src="../signup.js?v=10"></script>
</body>
</html>
