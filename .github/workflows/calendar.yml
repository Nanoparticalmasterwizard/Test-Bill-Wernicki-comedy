# Rebuilds the "Remind me" calendar files in cal/ whenever content.js changes.
name: Calendar files
on:
  push:
    branches: [main]
    paths: [content.js, tools/build-calendar.js]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/build-calendar.js
      - name: Commit if changed
        run: |
          git add -A cal
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update calendar files"
          git push
